{% assign repo_url = include.url %}
{% if repo_url == nil or repo_url == "" %}
  {% assign repo_url = "https://github.com/" | append: include.repo %}
{% endif %}
<span class="paper-link-star"><a class="github-star-badge" href="{{ repo_url }}"><img class="github-star-badge__img" src="https://img.shields.io/github/stars/{{ include.repo }}?style=flat-square&label=&logo=github" alt="GitHub stars for {{ include.repo }}"></a></span>
